            return Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y);
          };

          canvas.addEventListener('touchstart', function (e) {
            e.preventDefault();
            SoundFX.init();
            for (let i = 0; i < e.changedTouches.length; i++) {
              const t = e.changedTouches[i];
              if (t.identifier === joyTouchId) continue;
              canvasTouches.set(t.identifier, { x: t.clientX, y: t.clientY });
            }
            lastPinchDist = canvasTouches.size >= 2 ? getPinchDistance() : null;
          }, { passive: false });

          canvas.addEventListener('touchmove', function (e) {
            if (canvasTouches.size === 0) return;
            let touchesCanvas = false;
            for (let i = 0; i < e.changedTouches.length; i++) {
              if (canvasTouches.has(e.changedTouches[i].identifier)) {
                touchesCanvas = true;
                break;
              }
            }
            if (!touchesCanvas) return;
            e.preventDefault();

            if (canvasTouches.size === 1) {
              for (let i = 0; i < e.changedTouches.length; i++) {
                const t = e.changedTouches[i];
                const prev = canvasTouches.get(t.identifier);
                if (!prev) continue;
                const dx = t.clientX - prev.x;
                const dy = t.clientY - prev.y;
                prev.x = t.clientX;
                prev.y = t.clientY;
                const sens = lookSensitivityTouch * (zoomState.currentFov / DEFAULT_FOV);
                player.yaw -= dx * sens;
                player.pitch = Math.max(-1.45, Math.min(1.45, player.pitch - dy * sens));
              }
            } else {
              for (let i = 0; i < e.changedTouches.length; i++) {
                const t = e.changedTouches[i];
                const entry = canvasTouches.get(t.identifier);
                if (entry) {
                  entry.x = t.clientX;
                  entry.y = t.clientY;
                }
              }
              const dist = getPinchDistance();
              if (lastPinchDist !== null && dist !== null && lastPinchDist > 6 && dist > 6) {
                adjustZoomByFactor(Math.log(lastPinchDist / dist));
              }
              lastPinchDist = dist;
            }
          }, { passive: false });

          const endCanvasTouch = function (e) {
            if (canvasTouches.size === 0) return;
            let removed = false;
            for (let i = 0; i < e.changedTouches.length; i++) {
              if (canvasTouches.delete(e.changedTouches[i].identifier)) {
                removed = true;
              }
            }
            if (!removed) return;
            lastPinchDist = canvasTouches.size >= 2 ? getPinchDistance() : null;
          };
          canvas.addEventListener('touchend', endCanvasTouch, { passive: true });
          canvas.addEventListener('touchcancel', endCanvasTouch, { passive: true });

          // Desktop Mouse Drag & Wheel / Trackpad Zoom (on canvas)
          canvas.addEventListener('mousedown', function (e) {
            if (e.button !== 0) return;
            SoundFX.init();
            mouseDragging = true;
            lastMouseX = e.clientX;
            lastMouseY = e.clientY;
          });
          window.addEventListener('mousemove', function (e) {
            if (!mouseDragging) return;
            const dx = e.clientX - lastMouseX;
            const dy = e.clientY - lastMouseY;
            lastMouseX = e.clientX;
            lastMouseY = e.clientY;
            const sens = lookSensitivityMouse * (zoomState.currentFov / DEFAULT_FOV);
            player.yaw -= dx * sens;
            player.pitch = Math.max(-1.45, Math.min(1.45, player.pitch - dy * sens));
          });
          window.addEventListener('mouseup', function () { mouseDragging = false; });

          canvas.addEventListener('wheel', function (e) {
            e.preventDefault();
            const logDelta = e.ctrlKey
              ? e.deltaY * 0.012
              : Math.sign(e.deltaY) * Math.min(Math.abs(e.deltaY), 120) * 0.0018;
            adjustZoomByFactor(logDelta);
          }, { passive: false });

          // Floating Zoom Badge tap-to-reset
          const zoomBadge = document.getElementById('zoom-badge');
          zoomBadge.addEventListener('click', function (e) {
            e.stopPropagation();
            resetZoom();
          });

          // 3. Action Buttons (Touch + Click)
          const bindTapButton = function (id, fn) {
            const btn = document.getElementById(id);
            let handledTouch = false;
            btn.addEventListener('touchstart', function (e) {
              e.preventDefault();
              e.stopPropagation();
              handledTouch = true;
              btn.classList.add('pressed');
              fn();
            }, { passive: false });
            btn.addEventListener('touchend', function () { btn.classList.remove('pressed'); });
            btn.addEventListener('touchcancel', function () { btn.classList.remove('pressed'); });
            btn.addEventListener('click', function (e) {
              e.stopPropagation();
              if (handledTouch) { handledTouch = false; return; }
              fn();
            });
          };

          const bindHoldButton = function (id, onChange) {
            const btn = document.getElementById(id);
            const start = function (e) {
              e.preventDefault();
              e.stopPropagation();
              SoundFX.init();
              btn.classList.add('pressed');
              onChange(true);
            };
            const end = function (e) {
              if (e) e.stopPropagation();
              btn.classList.remove('pressed');
              onChange(false);
            };
            btn.addEventListener('touchstart', start, { passive: false });
            btn.addEventListener('touchend', end);
            btn.addEventListener('touchcancel', end);
            btn.addEventListener('mousedown', start);
            window.addEventListener('mouseup', function () { end(); });
          };

          bindTapButton('btn-place', handlePlaceBlock);
          bindTapButton('btn-break', handleBreakBlock);
          bindHoldButton('btn-jump', function (held) { input.jumpHeld = held; });
          bindHoldButton('btn-fly-down', function (held) { input.flyDownHeld = held; });

          // 4. Top HUD Buttons & Modals
          document.getElementById('btn-fly').addEventListener('click', toggleFlyMode);
          document.getElementById('btn-view').addEventListener('click', cycleCameraView);
          document.getElementById('btn-sky').addEventListener('click', function () {
            skyIndex = (skyIndex + 1) % SKY_MODES.length;
            applySkyMode(skyIndex);
            showToast('Sky: ' + SKY_MODES[skyIndex].name);
          });
          document.getElementById('btn-save').addEventListener('click', saveWorld);
          document.getElementById('btn-clear-bp').addEventListener('click', function () {
            clearBlueprint();
            showToast('Blueprint cleared');
          });
          document.getElementById('btn-rotate-bp').addEventListener('click', rotateActiveBlueprint);
          document.getElementById('btn-autobuild-bp').addEventListener('click', toggleAutoBuild);
          document.getElementById('btn-mute').addEventListener('click', function () {
            SoundFX.muted = !SoundFX.muted;
            document.getElementById('sound-icon').innerHTML = SoundFX.muted
              ? '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/>'
              : '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>';
            showToast(SoundFX.muted ? 'Sound Muted' : 'Sound On');
          });
          document.getElementById('btn-help').addEventListener('click', openWelcomeModal);

          const bpModal = document.getElementById('blueprint-modal');
          const resetModal = document.getElementById('reset-modal');
          const bpGrid = document.getElementById('blueprint-grid');
          let activeBpCategory = 'all';

          function renderBlueprintGrid(category) {
            activeBpCategory = category;
            bpGrid.innerHTML = '';
            const items = BLUEPRINT_CATALOG.filter(function (item) {
              return category === 'all' || item.category === category;
            });
            items.forEach(function (item) {
              const data = buildBlueprintData(item.id);
              const card = document.createElement('button');
              card.type = 'button';
              card.className = 'bp-card';
              card.innerHTML =
                '<div class="bp-card-top">' +
                  '<div class="bp-icon-badge">' + item.icon + '</div>' +
                  '<div class="bp-card-title">' + item.name + '</div>' +
                '</div>' +
                '<div class="bp-card-desc">' + item.desc + '</div>' +
                '<div class="bp-card-meta">' +
                  '<span class="bp-meta-tag">' + data.width + '×' + data.depth + '×' + data.height + '</span>' +
                  '<span class="bp-meta-count">' + data.blocks.length + ' blks</span>' +
                '</div>';
              card.addEventListener('click', function () {
                spawnBlueprint(item.id);
                bpModal.classList.remove('open');
              });
              bpGrid.appendChild(card);
            });
          }

          document.querySelectorAll('.bp-filter-pill').forEach(function (pill) {
            pill.addEventListener('click', function () {
              document.querySelectorAll('.bp-filter-pill').forEach(function (p) {
                p.classList.toggle('active', p === pill);
              });
              renderBlueprintGrid(pill.dataset.cat);
            });
          });
          renderBlueprintGrid(activeBpCategory);

          document.getElementById('btn-blueprints').addEventListener('click', function () {
            bpModal.classList.add('open');
          });
          document.getElementById('btn-close-bp').addEventListener('click', function () {
            bpModal.classList.remove('open');
          });

          document.getElementById('btn-reset').addEventListener('click', function () {
            resetModal.classList.add('open');
          });
          document.getElementById('btn-cancel-reset').addEventListener('click', function () {
            resetModal.classList.remove('open');
          });
          document.getElementById('btn-confirm-reset').addEventListener('click', function () {
            try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
            generateStarterIsland();
            resetModal.classList.remove('open');
            showToast('Fresh island generated!');
          });

          // 5. Desktop Keyboard Controls
          window.addEventListener('keydown', function (e) {
            input.keys[e.code] = true;
            if (!gameActive) return;
            if (e.code === 'KeyE') handlePlaceBlock();
            if (e.code === 'KeyQ') handleBreakBlock();
            if (e.code === 'KeyF') toggleFlyMode();
            if (e.code === 'KeyV') cycleCameraView();
            if (e.code === 'KeyR') resetZoom();
            if (e.code.startsWith('Digit')) {
              const num = parseInt(e.code.replace('Digit', ''), 10);
              if (num >= 1 && num <= BLOCK_TYPES.length) {
                selectBlock(BLOCK_TYPES[num - 1].id);
              }
            }
          });
          window.addEventListener('keyup', function (e) {
            input.keys[e.code] = false;
          });
        }

        /* -------------------------------------------------------------------
           INIT SCENE & ANIMATION LOOP
           ------------------------------------------------------------------- */
        const canvas = document.getElementById('three-canvas');
        renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: false, powerPreference: 'high-performance' });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);

        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(DEFAULT_FOV, window.innerWidth / window.innerHeight, 0.1, 110);

        ambientLight = new THREE.AmbientLight(0xffffff, 0.56);
        scene.add(ambientLight);

        hemiLight = new THREE.HemisphereLight(0x99dcff, 0x4d7c4f, 0.35);
        scene.add(hemiLight);

        sunLight = new THREE.DirectionalLight(0xfff8e7, 0.95);
        sunLight.position.set(24, 38, 18);
        scene.add(sunLight);

        worldGroup = new THREE.Group();
        scene.add(worldGroup);

        blueprintGroup = new THREE.Group();
        scene.add(blueprintGroup);

        particleGroup = new THREE.Group();
        scene.add(particleGroup);

        const edgesGeo = new THREE.EdgesGeometry(new THREE.BoxGeometry(1.015, 1.015, 1.015));
        highlightBox = new THREE.LineSegments(
          edgesGeo,
          new THREE.LineBasicMaterial({ color: 0x0f172a, transparent: true, opacity: 0.85 })
        );
        highlightBox.visible = false;
        scene.add(highlightBox);

        ghostHighlightBox = new THREE.LineSegments(
          edgesGeo,
          new THREE.LineBasicMaterial({ color: 0x2dd4bf, transparent: true, opacity: 0.95 })
        );
        ghostHighlightBox.visible = false;
        scene.add(ghostHighlightBox);

        buildMaterials();
        buildClouds();
        buildPlayerAvatar();
        applySkyMode(skyIndex);

        if (!loadWorldIfSaved()) {
          generateStarterIsland();
        }

        buildHotbar();
        setupControls();

        window.addEventListener('resize', function () {
          const w = window.innerWidth;
          const h = window.innerHeight;
          camera.aspect = w / h;
          camera.updateProjectionMatrix();
          renderer.setSize(w, h);
        });

        let lastTime = performance.now();
        const crosshairEl = document.getElementById('crosshair');
        const targetHintEl = document.getElementById('target-hint');

        function animate(now) {
          requestAnimationFrame(animate);
          const dt = Math.min(0.05, (now - lastTime) / 1000 || 0.016);
          lastTime = now;

          updatePlayer(dt);
          updateParticles(dt);
          stepAutoBuild(dt);

          // Smooth FOV & 3rd-person pull-back interpolation
          const zoomAlpha = 1 - Math.exp(-14 * dt);
          if (Math.abs(zoomState.targetFov - zoomState.currentFov) > 0.02) {
            zoomState.currentFov += (zoomState.targetFov - zoomState.currentFov) * zoomAlpha;
            camera.fov = zoomState.currentFov;
            camera.updateProjectionMatrix();
          }
          if (Math.abs(zoomState.targetCamDist - zoomState.currentCamDist) > 0.005) {
            zoomState.currentCamDist += (zoomState.targetCamDist - zoomState.currentCamDist) * zoomAlpha;
          }

          // Drift clouds
          if (cloudGroup) {
            for (let i = 0; i < cloudGroup.children.length; i++) {
              const c = cloudGroup.children[i];
              c.position.x += c.userData.speed * dt;
              if (c.position.x > 24) c.position.x = -24;
            }
          }

          // Raycast target highlight
          currentTarget = castVoxelRay();
          if (currentTarget.ghostHit) {
            const g = currentTarget.ghostHit;
            ghostHighlightBox.position.set(g.x + 0.5, g.y + 0.5, g.z + 0.5);
            ghostHighlightBox.visible = true;
            highlightBox.visible = false;
            crosshairEl.classList.add('blueprint-target');
            targetHintEl.textContent = 'Tap PLACE → ' + BLOCK_BY_ID[g.type].name;
            targetHintEl.classList.add('visible');
          } else if (currentTarget.solidHit) {
            const h = currentTarget.solidHit;
            highlightBox.position.set(h.x + 0.5, h.y + 0.5, h.z + 0.5);
            highlightBox.visible = true;
            ghostHighlightBox.visible = false;
            crosshairEl.classList.remove('blueprint-target');
            targetHintEl.classList.remove('visible');
          } else {
            highlightBox.visible = false;
            ghostHighlightBox.visible = false;
            crosshairEl.classList.remove('blueprint-target');
            targetHintEl.classList.remove('visible');
          }

          renderer.render(scene, camera);
        }

        requestAnimationFrame(animate);
      }

      // Ensure Three.js is loaded (with unpkg fallback if cdnjs is blocked)
      function startWhenReady() {
        if (typeof THREE !== 'undefined') {
          try {
            bootEngine();
          } catch (err) {
            console.error('Block Craft 3D init error:', err);
            showToast('Graphics error: please reload');
          }
        } else {
          const fallback = document.createElement('script');
          fallback.src = 'https://unpkg.com/three@0.128.0/build/three.min.js';
          fallback.onload = function () {
            try {
              bootEngine();
            } catch (err) {
              console.error('Block Craft 3D fallback init error:', err);
              showToast('Graphics error: please reload');
            }
          };
          fallback.onerror = function () {
            showToast('Could not load 3D library');
          };
          document.head.appendChild(fallback);
        }
      }

      window.addEventListener('load', startWhenReady);
    })();
  </script>
